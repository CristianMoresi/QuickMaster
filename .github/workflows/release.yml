name: Release

# Package the already-validated JAR for each platform. The author creates a draft
# release and uploads its core JAR before pushing the version tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Portable (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows }
          - { os: macos-latest,   label: macos }
          - { os: ubuntu-latest,  label: linux }

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Version from tag
        id: ver
        shell: bash
        run: echo "v=$(echo "${GITHUB_REF_NAME#v}" | sed 's/-.*//')" >> "$GITHUB_OUTPUT"

      - name: Resolve platform dependencies and download the validated JAR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mvn -B -ntp install:install-file -Dfile=libs/dspark-0.1.0.jar -DpomFile=libs/dspark-0.1.0.pom
          mvn -B -ntp dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/app
          gh release download "$GITHUB_REF_NAME" --pattern "QuickMaster-core-${{ steps.ver.outputs.v }}.jar" --dir target/release
          cp "target/release/QuickMaster-core-${{ steps.ver.outputs.v }}.jar" target/app/quickmaster.jar

      - name: Verify version, hash and bound loudness evidence
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.v }}
        run: |
          $ErrorActionPreference = 'Stop'
          $record = Get-Content "docs/releases/$env:RELEASE_VERSION.json" -Raw | ConvertFrom-Json
          if ($record.version -ne $env:RELEASE_VERSION -or $record.jarAsset -ne "QuickMaster-core-$env:RELEASE_VERSION.jar") {
            throw 'Release record does not match the tag'
          }
          java tools/VerifyReleaseJar.java target/app/quickmaster.jar $record.version $record.jarSha256
          if ($LASTEXITCODE -ne 0) { throw 'Validated release JAR check failed' }

      - name: Build the macOS icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s docs/icon-master.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d docs/icon-master.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o docs/icon.icns

      - name: Package the portable app image
        shell: bash
        run: |
          ICON=docs/icon-master.png
          [ "$RUNNER_OS" = "Windows" ] && ICON=docs/icon.ico
          [ "$RUNNER_OS" = "macOS" ] && ICON=docs/icon.icns
          jpackage --type app-image \
            --name QuickMaster \
            --app-version "${{ steps.ver.outputs.v }}" \
            --vendor "Cristian Moresi" \
            --input target/app \
            --main-jar quickmaster.jar \
            --main-class com.quickmaster.Launcher \
            --icon "$ICON" \
            --add-modules java.base,java.desktop,java.scripting,java.sql,java.logging,java.xml,java.prefs,java.management,java.naming,jdk.jfr,jdk.unsupported,jdk.zipfs,jdk.localedata \
            --dest dist

      - name: Zip the bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/QuickMaster -DestinationPath "QuickMaster-windows-${{ steps.ver.outputs.v }}.zip"

      - name: Zip the bundle (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: (cd dist && zip -ry "../QuickMaster-${{ matrix.label }}-${{ steps.ver.outputs.v }}.zip" .)

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "QuickMaster-${{ matrix.label }}-${{ steps.ver.outputs.v }}.zip"
